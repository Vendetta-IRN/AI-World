name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project (unzip if needed)
        run: |
          if [ ! -f package.json ] && [ ! -f pocket-chat/package.json ] && [ -f pocket-chat.zip ]; then
            unzip -q pocket-chat.zip
          fi
          if [ -f package.json ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          elif [ -f pocket-chat/package.json ]; then
            echo "APP_DIR=pocket-chat" >> "$GITHUB_ENV"
          else
            echo "package.json not found. Repo files:"
            ls -la
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
